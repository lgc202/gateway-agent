version: "2"
sql:
  - name: apiserver
    engine: mysql
    schema: migrations
    queries: apiserver/queries
    gen:
      go:
        package: sqlc
        out: ../internal/apiserver/store/mysql/sqlc
        sql_package: database/sql
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - column: chats.model_config_id
            go_type:
              type: uint64
              pointer: true
          - column: model_configs.api_key
            go_type:
              type: byte
              slice: true
        rename:
          base_url: BaseURL
          api_key: APIKey
          api_key_configured: APIKeyConfigured
